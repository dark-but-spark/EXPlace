name: compare_quick

seed: 3
gpu: 0
use_cuda: False

clip_param: 0.2
max_grad_norm: 0.5
ppo_epoch: 1
gamma: 0.95
lr: 2.5e-3
dpo_lr: 1.0e-4

grid: 224
episode: 4
PO_episode: 0
epoch: 1
PO_epoch: 0
buffer_size: 2
batch_size: 64
preference_batch_size: 2
rollout_batch_size: 2
num_trajectories_per_iteration: 4

used_masks: ["reg", "hier", "df", "wire", "port", "pos"]
trade_off_coeff: [0.45, 0.2, 0.15, 0.15, 0.05]
reward_weight_mode: fixed
reward_granularity: step
global_reward_gamma: 1.0

dataflow_cutoff: 0.00
halo: 0
soft_coefficient: 1.0
use_reward_scaling: True
disable_tqdm: True
core_area_block: 0
load_dir: "rl_logs/superblue18/EXPlace/"
corner_flag: False
late_stage_episode: 0
prototype_flag: False
regulator_flag: False

# This comparison measures RL rollout/update cost, not physical-design signoff.
use_dmp_for_evaluation: False
use_timer_for_evaluation: False
evaluate_best_reward_with_dmp: False
visualize_prototype: False
visualization_interval: 0
evaluation_interval: 100

actor_arch: parallel
local_summary_k: 2
log_dir: "./comparison_runs"
