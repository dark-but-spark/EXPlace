name: optimization_physical_long

seed: 3
gpu: 0
use_cuda: True

clip_param: 0.2
max_grad_norm: 0.5
ppo_epoch: 1
gamma: 0.95
lr: 2.5e-3
dpo_lr: 1.0e-4

grid: 224
episode: 600
PO_episode: 0
epoch: 1
PO_epoch: 0
buffer_size: 10
batch_size: 256
preference_batch_size: 4
rollout_batch_size: 10
num_trajectories_per_iteration: 20

used_masks: ["reg", "hier", "df", "wire", "port", "pos"]
trade_off_coeff: [0.45, 0.2, 0.15, 0.15, 0.05]
reward_weight_mode: fixed
reward_granularity: step
global_reward_gamma: 1.0

compact_transition: true
worker_rollout: true
mixed_precision: false
amp_dtype: bfloat16
async_evaluation: true
mask_cache: true
vectorized_occupancy: true
batch_device_copy: true

dataflow_cutoff: 0.00
halo: 0
soft_coefficient: 1.0
use_reward_scaling: True
disable_tqdm: True
core_area_block: 0
load_dir: "rl_logs/superblue18/EXPlace/"
corner_flag: False
late_stage_episode: 0
prototype_flag: False
regulator_flag: False

use_dmp_for_evaluation: True
use_timer_for_evaluation: True
evaluate_best_reward_with_dmp: False
visualize_prototype: False
visualization_interval: 0
evaluation_interval: 100

actor_arch: parallel
local_summary_k: 2
log_dir: "./physical_optimization_runs"
